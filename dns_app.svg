<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%">
  <defs>
    <linearGradient id="bgApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#111722" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Фон и рамка карточки -->
  <rect width="460" height="220" rx="10" fill="url(#bgApp)" stroke="#21262d" stroke-width="1.5" />

  <!-- Верхний акцентный штрих -->
  <rect x="28" y="26" width="28" height="3" rx="1.5" fill="url(#accApp)" />

  <!-- Иконка-иллюстрация окна MVVM справа вверху -->
  <g transform="translate(336, 22)">
    <rect x="0" y="0" width="96" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <line x1="0" y1="14" x2="96" y2="14" stroke="#30363d" stroke-width="1.2" />
    <circle cx="9" cy="7" r="2.2" fill="#f85149" opacity="0.8" />
    <circle cx="17" cy="7" r="2.2" fill="#e3b341" opacity="0.8" />
    <circle cx="25" cy="7" r="2.2" fill="#3fb950" opacity="0.8" />
    <!-- Элементы интерфейса внутри мини-окна -->
    <rect x="8" y="21" width="52" height="6" rx="2" fill="#38bdf8" opacity="0.7" />
    <rect x="64" y="21" width="24" height="6" rx="2" fill="#818cf8" opacity="0.8" />
    <rect x="8" y="33" width="80" height="5" rx="1.5" fill="#21262d" />
    <rect x="8" y="42" width="80" height="5" rx="1.5" fill="#21262d" />
    <rect x="8" y="51" width="60" height="5" rx="1.5" fill="#21262d" />
  </g>

  <!-- Заголовок и подзаголовок -->
  <text x="28" y="56" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f0f6fc" letter-spacing="-0.4">DnsEquipmentLedger</text>
  <text x="28" y="76" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="13.5" font-style="italic" fill="#38bdf8">Enterprise Desktop Module · WPF MVVM</text>

  <!-- Описание архитектуры -->
  <text x="28" y="108" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-size="12.5" fill="#8b949e">
    Zero-code-behind client architecture with reactive data
  </text>
  <text x="28" y="126" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-size="12.5" fill="#8b949e">
    binding, instant search filtering, and GoF design patterns:
  </text>
  <text x="28" y="146" font-family="monospace" font-size="11.5" font-weight="600" fill="#c9d1d9">
    Repository  ·  RelayCommand  ·  Observer (INPC)
  </text>

  <!-- Нижние плашки стека -->
  <g transform="translate(28, 168)">
    <rect x="0" y="0" width="66" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="33" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">.NET 8.0</text>

    <rect x="74" y="0" width="54" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="101" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">C# 12</text>

    <rect x="136" y="0" width="82" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="177" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#c084fc" text-anchor="middle">WPF XAML</text>

    <rect x="226" y="0" width="86" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="269" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle">SOLID / GoF</text>
  </g>
</svg>