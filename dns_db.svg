<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%">
  <defs>
    <linearGradient id="bgDb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#10191f" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accDb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Фон и рамка карточки -->
  <rect width="460" height="220" rx="10" fill="url(#bgDb)" stroke="#21262d" stroke-width="1.5" />

  <!-- Верхний акцентный штрих -->
  <rect x="28" y="26" width="28" height="3" rx="1.5" fill="url(#accDb)" />

  <!-- Иллюстрация связей таблиц ERD (Crow's Foot) справа вверху -->
  <g transform="translate(332, 22)">
    <!-- Линии связей 1-ко-многим -->
    <path d="M36 18 L64 18" stroke="#34d399" stroke-width="1.4" stroke-dasharray="2,2" />
    <path d="M36 46 L64 32" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="2,2" />
    <!-- Узел таблицы 1 -->
    <rect x="0" y="6" width="36" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <line x1="6" y1="13" x2="22" y2="13" stroke="#34d399" stroke-width="2" />
    <line x1="6" y1="20" x2="30" y2="20" stroke="#8b949e" stroke-width="1.5" />
    <!-- Узел таблицы 2 -->
    <rect x="0" y="36" width="36" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <line x1="6" y1="43" x2="22" y2="43" stroke="#38bdf8" stroke-width="2" />
    <line x1="6" y1="50" x2="30" y2="50" stroke="#8b949e" stroke-width="1.5" />
    <!-- Центральная таблица реестра -->
    <rect x="64" y="10" width="36" height="44" rx="4" fill="#161b22" stroke="#34d399" stroke-width="1.5" />
    <line x1="70" y1="19" x2="92" y2="19" stroke="#f0f6fc" stroke-width="2" />
    <line x1="70" y1="28" x2="94" y2="28" stroke="#8b949e" stroke-width="1.5" />
    <line x1="70" y1="36" x2="94" y2="36" stroke="#8b949e" stroke-width="1.5" />
    <line x1="70" y1="44" x2="86" y2="44" stroke="#8b949e" stroke-width="1.5" />
  </g>

  <!-- Заголовок и подзаголовок -->
  <text x="28" y="56" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f0f6fc" letter-spacing="-0.4">3NF Relational Schema</text>
  <text x="28" y="76" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="13.5" font-style="italic" fill="#34d399">Crow's Foot ERD · EF Core Data Layer</text>

  <!-- Описание БД -->
  <text x="28" y="108" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-size="12.5" fill="#8b949e">
    Normalized 6-table relational database with unique index
  </text>
  <text x="28" y="126" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-size="12.5" fill="#8b949e">
    constraints, cascade protection, and zero-config startup:
  </text>
  <text x="28" y="146" font-family="monospace" font-size="11.5" font-weight="600" fill="#c9d1d9">
    Database.Migrate()  ·  Fluent API  ·  Data Seeding
  </text>

  <!-- Нижние плашки стека -->
  <g transform="translate(28, 168)">
    <rect x="0" y="0" width="80" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="40" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle">SQLite 3NF</text>

    <rect x="88" y="0" width="70" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="123" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">EF Core</text>

    <rect x="166" y="0" width="76" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="204" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Code-First</text>

    <rect x="250" y="0" width="84" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="292" y="16" font-family="monospace" font-size="10.5" font-weight="600" fill="#818cf8" text-anchor="middle">Visio ERD</text>
  </g>
</svg>